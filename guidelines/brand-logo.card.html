<!-- @dsCard group="Brand" viewport="700x280" name="Logo Variants" subtitle="Horizontal, vertical, and mark — color, white, B&W" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-sans); padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 14px 12px; gap: 10px; border-radius: var(--radius-lg); }
  .dark  { background: var(--bg-base); }
  .navy  { background: var(--color-navy); }
  .light { background: var(--color-light); }
  img { object-fit: contain; }
  .lbl { font-size: 9px; font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-widest); text-align: center; }
  .lbl-light { color: var(--text-muted); }
  .lbl-dark  { color: rgba(3,2,27,0.38); }
  .badge-primary {
    font-size: 8px; font-weight: var(--weight-bold); letter-spacing: var(--tracking-widest);
    text-transform: uppercase; background: var(--accent); color: var(--text-on-accent);
    border-radius: var(--radius-full); padding: 3px 8px;
  }
</style>
</head>
<body>

  <!-- Principal -->
  <div class="row">
    <div class="cell navy" style="flex:1; border: 1.5px solid rgba(252,238,33,0.35);">
      <img src="../assets/logos/logo-horizontal-color-dark.svg" alt="Mooza horizontal color dark" style="max-width:200px; max-height:60px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="lbl lbl-light">Horizontal · Color · Fondo oscuro</span>
        <span class="badge-primary">Principal</span>
      </div>
    </div>
  </div>

  <!-- Row 1: Other horizontal -->
  <div class="row">
    <div class="cell dark" style="flex:1">
      <img src="../assets/logos/logo-horizontal-white.svg" alt="Mooza horizontal white" style="max-width:130px; max-height:48px;">
      <span class="lbl lbl-light">Horizontal · White</span>
    </div>
    <div class="cell light" style="flex:1">
      <img src="../assets/logos/logo-horizontal-color.svg" alt="Mooza horizontal color" style="max-width:130px; max-height:48px;">
      <span class="lbl lbl-dark">Horizontal · Color</span>
    </div>
    <div class="cell light" style="flex:1">
      <img src="../assets/logos/logo-horizontal-bya.svg" alt="Mooza horizontal B&amp;W" style="max-width:130px; max-height:48px;">
      <span class="lbl lbl-dark">Horizontal · B&amp;W</span>
    </div>
  </div>

  <!-- Row 2: Mark/iso + vertical -->
  <div class="row">
    <div class="cell dark" style="flex:0.7">
      <img src="../assets/logos/logo-iso-white.svg" style="max-width:40px;">
      <span class="lbl lbl-light">Iso · White</span>
    </div>
    <div class="cell navy" style="flex:0.7">
      <img src="../assets/logos/logo-iso-color.svg" style="max-width:40px;">
      <span class="lbl lbl-light">Iso · Color</span>
    </div>
    <div class="cell light" style="flex:0.7">
      <img src="../assets/logos/logo-iso-white.svg" style="max-width:40px; filter:invert(1) brightness(0);">
      <span class="lbl lbl-dark">Iso · B&amp;W</span>
    </div>
    <div class="cell dark" style="flex:0.7">
      <img src="../assets/logos/logo-icon-gradient.svg" style="max-width:52px; border-radius:12px;">
      <span class="lbl lbl-light">App Icon</span>
    </div>
    <div class="cell navy" style="flex:1">
      <img src="../assets/logos/logo-vertical-color-dark.svg" style="max-height:76px; max-width:90px;">
      <span class="lbl lbl-light">Vertical · Color · Fondo oscuro</span>
    </div>
  </div>

</body>
</html>
