<!-- @dsCard group="Colors" viewport="700x140" name="Brand Palette" subtitle="5 official brand colors" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; min-height: 140px; }
  .row { display: flex; gap: 20px; padding: 20px 28px; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .circle { width: 60px; height: 60px; border-radius: 50%; }
  .label { font-size: 11px; font-weight: var(--weight-medium); color: var(--text-secondary); letter-spacing: var(--tracking-wide); }
  .name  { font-size: 10px; font-weight: var(--weight-bold); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-widest); margin-top: -6px; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="circle" style="background:#fcee21; box-shadow: 0 0 20px rgba(252,238,33,0.4);"></div><span class="label">#fcee21</span><span class="name">Amarillo</span></div>
  <div class="swatch"><div class="circle" style="background:#fbb03b; box-shadow: 0 0 16px rgba(251,176,59,0.3);"></div><span class="label">#fbb03b</span><span class="name">Naranja</span></div>
  <div class="swatch"><div class="circle" style="background:#1b1444; border: 1px solid rgba(255,255,255,0.12);"></div><span class="label">#1b1444</span><span class="name">Azul Noche</span></div>
  <div class="swatch"><div class="circle" style="background:#03021b; border: 1px solid rgba(255,255,255,0.08);"></div><span class="label">#03021b</span><span class="name">Noche Profunda</span></div>
  <div class="swatch"><div class="circle" style="background:#f2f2f2;"></div><span class="label" style="color:var(--text-secondary)">#f2f2f2</span><span class="name">Gris Luz</span></div>
</div>
</body>
</html>
