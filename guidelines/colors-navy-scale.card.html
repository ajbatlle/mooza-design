<!-- @dsCard group="Colors" viewport="700x110" name="Navy Scale" subtitle="Dark surface elevation steps" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-sans); display: flex; align-items: center; min-height: 110px; padding: 0 20px; }
  .row { display: flex; gap: 6px; width: 100%; }
  .step { flex: 1; height: 52px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; }
  .lbl { font-size: 9px; font-weight: var(--weight-semibold); color: var(--text-muted); letter-spacing: var(--tracking-wide); }
</style>
</head>
<body>
<div class="row">
  <div class="step" style="background:var(--color-navy-950)"><span class="lbl">950</span></div>
  <div class="step" style="background:var(--color-navy-900)"><span class="lbl">900</span></div>
  <div class="step" style="background:var(--color-navy-850)"><span class="lbl">850</span></div>
  <div class="step" style="background:var(--color-navy-800)"><span class="lbl">800</span></div>
  <div class="step" style="background:var(--color-navy-700)"><span class="lbl">700</span></div>
  <div class="step" style="background:var(--color-navy-600)"><span class="lbl">600</span></div>
  <div class="step" style="background:var(--color-navy-500)"><span class="lbl">500</span></div>
  <div class="step" style="background:var(--color-navy-400)"><span class="lbl">400</span></div>
  <div class="step" style="background:var(--color-navy-300)"><span class="lbl">300</span></div>
  <div class="step" style="background:var(--color-navy-200)"><span class="lbl">200</span></div>
  <div class="step" style="background:var(--color-navy-100)"><span class="lbl">100</span></div>
</div>
</body>
</html>
