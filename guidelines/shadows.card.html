<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows & Glow" subtitle="Elevation + yellow glow system" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-sans); padding: 24px 28px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box  { width: 80px; height: 52px; border-radius: var(--radius-lg); background: var(--bg-surface); display: flex; align-items: center; justify-content: center; }
  .lbl  { font-size: 9px; font-weight: var(--weight-semibold); color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">shadow-sm</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">shadow-md</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">shadow-lg</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lbl">shadow-xl</div></div>
  <div class="item"><div class="box" style="background:var(--accent); box-shadow:var(--glow-yellow-sm)"></div><div class="lbl">glow-yellow-sm</div></div>
  <div class="item"><div class="box" style="background:var(--accent); box-shadow:var(--glow-yellow)"></div><div class="lbl">glow-yellow</div></div>
  <div class="item"><div class="box" style="background:var(--accent-warm); box-shadow:var(--glow-orange)"></div><div class="lbl">glow-orange</div></div>
</div>
</body>
</html>
