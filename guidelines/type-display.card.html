<!-- @dsCard group="Type" viewport="700x220" name="Display Type" subtitle="Sora ExtraBold — headlines and hero copy" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); padding: 28px; }
  .hero { font-family: var(--font-display); font-weight: var(--weight-extrabold); font-size: var(--text-5xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }
  .hero span { color: var(--accent); }
  .sub  { font-family: var(--font-display); font-weight: var(--weight-bold); font-size: var(--text-xl); color: var(--text-secondary); margin-top: 10px; letter-spacing: var(--tracking-tight); }
  .meta { margin-top: 12px; font-family: var(--font-sans); font-size: 10px; font-weight: var(--weight-semibold); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-widest); }
</style>
</head>
<body>
  <div class="hero" style="color:var(--text-primary)">Tu semana <span>cultural</span></div>
  <div class="sub">Agenda Cultural de Chile</div>
  <div class="meta">Sora · 800 ExtraBold · −0.015em · var(--font-display)</div>
</body>
</html>
