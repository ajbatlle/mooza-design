<!-- @dsCard group="Type" viewport="700x160" name="Label Styles" subtitle="Category, metadata, and badge copy patterns" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-sans); padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .ex { display: flex; align-items: center; gap: 20px; }
  .label-cat  { font-size: 10px; font-weight: var(--weight-bold); color: var(--accent); text-transform: uppercase; letter-spacing: var(--tracking-widest); border: 1.5px solid var(--accent); border-radius: var(--radius-full); padding: 3px 10px; font-family: var(--font-sans); }
  .label-feat { font-size: 10px; font-weight: var(--weight-bold); color: var(--text-on-accent); text-transform: uppercase; letter-spacing: var(--tracking-widest); background: var(--accent); border-radius: var(--radius-full); padding: 3px 10px; font-family: var(--font-sans); }
  .label-meta { font-size: var(--text-sm); font-weight: var(--weight-regular); color: var(--text-secondary); }
  .label-week { font-size: var(--text-sm); font-weight: var(--weight-bold); color: var(--text-on-accent); background: var(--accent); border-radius: var(--radius-full); padding: 5px 14px; font-family: var(--font-sans); }
  .label-hero { font-family: var(--font-display); font-weight: var(--weight-extrabold); font-size: var(--text-lg); color: var(--text-primary); letter-spacing: var(--tracking-tight); }
  .label-hero span { color: var(--accent); }
  .lbl { font-size: 10px; color: var(--text-muted); min-width: 140px; }
</style>
</head>
<body>
  <div class="ex"><span class="lbl">Hero (Sora 800)</span><span class="label-hero">Tu semana <span>cultural</span></span></div>
  <div class="ex"><span class="lbl">Category label</span><span class="label-cat">MÚSICA</span><span class="label-cat">DESTACADO • EVENTO</span></div>
  <div class="ex"><span class="lbl">Featured badge</span><span class="label-feat">DESTACADO</span></div>
  <div class="ex"><span class="lbl">Venue metadata</span><span class="label-meta">Bar de René • 21:30</span></div>
  <div class="ex"><span class="lbl">Week range pill</span><span class="label-week">15 — 21 junio</span></div>
</body>
</html>
