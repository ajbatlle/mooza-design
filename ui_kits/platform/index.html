<!-- @dsCard group="App" viewport="390x760" name="Event Discovery" subtitle="Interactive weekly cultural agenda — home feed and event detail" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mooza — Tu semana cultural</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #03021b; font-family: var(--font-sans); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  input::placeholder { color: var(--text-muted); }
  .chip-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.MoozaDesignSystem_46d3b8;
const { Button, Badge, DateBlock, PriceTag, EventCard, Input, CategoryChip } = NS;

const EVENTS = [
  { id:1,  day:'20', dayName:'SÁB', category:'MÚSICA',  title:'4sure (no doubt) en casa elisa pizza bar, peñaflor',              venue:'Casa Elisa Pizzabar',            time:'22:00', price:6000,  priceVariant:'default'  },
  { id:2,  day:'20', dayName:'SÁB', category:'MÚSICA',  title:'El alma al aire ii – canciones de alejandro sanz en bar la otra casa', venue:'Bar La Otra Casa',             time:'22:00', price:10000, priceVariant:'default'  },
  { id:3,  day:'20', dayName:'SÁB', category:'MÚSICA',  title:'Glam fest en biker chop',                                         venue:'Biker Chop',                     time:'22:00', price:8000,  priceVariant:'default'  },
  { id:4,  day:'20', dayName:'SÁB', category:'MÚSICA',  title:'Leo quinteros vuelve al bar de rené',                              venue:'Bar de René',                    time:'21:30', price:6000,  priceVariant:'from',     featured:true },
  { id:5,  day:'20', dayName:'SÁB', category:'MÚSICA',  title:'Schwenke y nilo en concierto en la casona de la florida',         venue:'La Casona de La Florida',        time:'18:30',             priceVariant:'free',     featured:true },
  { id:6,  day:'21', dayName:'DOM', category:'MÚSICA',  title:'Concierto Homenaje a los Ídolos de América',                      venue:'Teatro Oriente',                 time:'20:00', price:15000, priceVariant:'default'  },
  { id:7,  day:'21', dayName:'DOM', category:'MÚSICA',  title:'Enzo tassara + simón cox en bar de rené',                         venue:'Bar de René',                    time:'21:30', price:5000,  priceVariant:'from',     featured:true },
  { id:8,  day:'21', dayName:'DOM', category:'TEATRO',  title:'Gatajazz presenta: oleaje en sala master',                        venue:'Sala Master, Universidad de Chile', time:'19:00', price:10000, priceVariant:'default', featured:true },
  { id:9,  day:'22', dayName:'LUN', category:'MÚSICA',  title:'Lanzamiento de disco mapuche "Kiñewküleiñ"',                      venue:'Auditorio FAU, Santiago',        time:'19:00',             priceVariant:'free'     },
  { id:10, day:'22', dayName:'LUN', category:'MÚSICA',  title:'Temporada de Cámara UC: Granados y Maslíah',                      venue:'Centro de Extensión Oriente',    time:'19:30', price:8000,  priceVariant:'from',     featured:true },
  { id:11, day:'23', dayName:'MAR', category:'CINE',    title:'Ciclo de cine latinoamericano: apertura con "La memoria del agua"', venue:'Centro Arte Alameda',           time:'20:30', price:4000,  priceVariant:'default'  },
  { id:12, day:'23', dayName:'MAR', category:'ARTE',    title:'Inauguración: paisajes interiores — exposición de Valentina Ruiz', venue:'Galería AMS Marlborough',       time:'19:00',             priceVariant:'free'     },
];

const CATEGORIES = ['Todos', 'Música', 'Teatro', 'Cine', 'Arte', 'Danza'];

// ─── Icon helper (Material Symbols Outlined) ───────────────────
const iconBase = {
  fontFamily: "'Material Symbols Outlined'",
  fontStyle: 'normal',
  lineHeight: 1,
  letterSpacing: 'normal',
  textTransform: 'none',
  display: 'inline-flex',
  alignItems: 'center',
  userSelect: 'none',
  fontVariationSettings: "'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 20",
};
const IconPin  = () => <span style={{...iconBase, fontSize:20, color:'var(--accent)'}}>location_on</span>;
const IconClock = () => <span style={{...iconBase, fontSize:20, color:'var(--accent)'}}>schedule</span>;
const IconBack  = () => <span style={{...iconBase, fontSize:20, color:'var(--text-primary)'}}>arrow_back</span>;

// ─── Home Screen ────────────────────────────────────────────────
function HomeScreen({ events, activeCategory, onCategoryChange, query, onQueryChange, onEventClick }) {
  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column', position:'relative'}}>

      {/* Ghost watermark */}
      <img src="../../assets/logos/logo-iso-white.svg" style={{
        position:'absolute', top:12, right:-24, width:200, opacity:0.055, pointerEvents:'none', zIndex:0,
      }} />

      {/* Header */}
      <div style={{position:'relative', zIndex:1, padding:'22px 24px 0', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <img src="../../assets/logos/logo-horizontal-white.svg" style={{height:22}} />
        <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:2}}>
          <span style={{fontFamily:'var(--font-sans)', fontSize:'10px', fontWeight:'var(--weight-bold)', color:'var(--text-muted)', letterSpacing:'var(--tracking-widest)', textTransform:'uppercase'}}>
            AGENDA CULTURAL
          </span>
          <span style={{fontFamily:'var(--font-sans)', fontSize:'10px', color:'var(--text-muted)', letterSpacing:'var(--tracking-wide)'}}>
            1 / 6
          </span>
        </div>
      </div>

      {/* Hero */}
      <div style={{position:'relative', zIndex:1, padding:'22px 24px 16px'}}>
        <div style={{
          display:'inline-flex', alignSelf:'flex-start', marginBottom:18,
          background:'var(--accent)', borderRadius:'var(--radius-full)', padding:'6px 16px',
          fontFamily:'var(--font-sans)', fontWeight:'var(--weight-bold)', fontSize:'13px', color:'var(--text-on-accent)',
        }}>
          15 — 21 junio
        </div>
        <div style={{fontFamily:'var(--font-sans)', fontWeight:'var(--weight-extrabold)', fontSize:'44px', lineHeight:1.1, letterSpacing:'-0.025em'}}>
          <span style={{color:'var(--text-primary)'}}>Tu semana<br/></span>
          <span style={{color:'var(--accent)'}}>cultural</span>
        </div>
      </div>

      {/* Search */}
      <div style={{padding:'0 24px 14px', position:'relative', zIndex:1}}>
        <Input placeholder="Buscar eventos..." icon="search" value={query} onChange={onQueryChange} />
      </div>

      {/* Category chips */}
      <div className="chip-row" style={{padding:'0 24px 16px', position:'relative', zIndex:1}}>
        {CATEGORIES.map(cat => (
          <CategoryChip key={cat} label={cat} active={activeCategory === cat} onClick={() => onCategoryChange(cat)} />
        ))}
      </div>

      {/* Divider */}
      <div style={{height:'1px', background:'var(--divider)', margin:'0 24px 4px'}} />

      {/* Event list */}
      <div style={{padding:'4px 24px 8px', flex:1, position:'relative', zIndex:1}}>
        {events.length === 0 ? (
          <div style={{padding:'40px 0', textAlign:'center', fontFamily:'var(--font-sans)', fontSize:'14px', color:'var(--text-muted)'}}>
            No se encontraron eventos
          </div>
        ) : events.map(ev => (
          <EventCard key={ev.id} {...ev} onClick={() => onEventClick(ev)} />
        ))}
      </div>

      {/* Footer */}
      <div style={{padding:'20px 24px', borderTop:'1px solid var(--divider)', textAlign:'center', position:'relative', zIndex:1}}>
        <span style={{fontFamily:'var(--font-sans)', fontSize:'13px', fontWeight:'var(--weight-semibold)', color:'var(--text-secondary)'}}>
          Toda la agenda en{' '}
          <span style={{color:'var(--accent)'}}>mooza.cl</span>
        </span>
        <div style={{fontFamily:'var(--font-sans)', fontSize:'11px', color:'var(--text-muted)', marginTop:4, letterSpacing:'var(--tracking-wide)'}}>@mooza_cl</div>
      </div>
    </div>
  );
}

// ─── Detail Screen ───────────────────────────────────────────────
function DetailScreen({ event, onBack }) {
  if (!event) return null;
  return (
    <div style={{width:'100%', minHeight:'100vh', display:'flex', flexDirection:'column'}}>

      {/* Hero area */}
      <div style={{
        position:'relative', height:260, flexShrink:0,
        background:'radial-gradient(ellipse at 40% 60%, #2c2566 0%, #1b1444 50%, #07051f 100%)',
        overflow:'hidden',
      }}>
        <img src="../../assets/logos/logo-iso-white.svg" style={{
          position:'absolute', bottom:-30, right:-20, width:180, opacity:0.07, pointerEvents:'none',
        }} />

        {/* Back */}
        <button onClick={onBack} style={{
          position:'absolute', top:20, left:20, zIndex:2,
          background:'rgba(255,255,255,0.08)', border:'1.5px solid rgba(255,255,255,0.18)',
          borderRadius:'var(--radius-full)', padding:'8px 16px',
          color:'var(--text-primary)', fontFamily:'var(--font-sans)',
          fontSize:'13px', fontWeight:'var(--weight-semibold)',
          cursor:'pointer', display:'flex', alignItems:'center', gap:6,
          backdropFilter:'blur(8px)',
        }}>
          <IconBack /><span style={{fontFamily:'var(--font-sans)'}}>Volver</span>
        </button>

        {/* Date + badges */}
        <div style={{position:'absolute', bottom:24, left:24, display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
          <DateBlock day={event.day} dayName={event.dayName} variant="highlighted" />
          {event.featured && <Badge label="DESTACADO" variant="featured" />}
          <Badge label={event.category} variant="category" />
        </div>
      </div>

      {/* Content */}
      <div style={{padding:24, flex:1, display:'flex', flexDirection:'column', gap:20, overflowY:'auto'}}>
        <h1 style={{
          fontFamily:'var(--font-sans)', fontWeight:'var(--weight-extrabold)',
          fontSize:'26px', lineHeight:1.2, letterSpacing:'-0.02em',
          color:'var(--text-primary)', margin:0,
        }}>
          {event.title}
        </h1>

        {/* Info rows */}
        <div style={{display:'flex', flexDirection:'column', gap:12}}>
          {event.venue && (
            <div style={{display:'flex', alignItems:'center', gap:12}}>
              <div style={{width:36, height:36, borderRadius:'var(--radius-md)', background:'var(--bg-surface-raised)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
                <IconPin />
              </div>
              <span style={{fontFamily:'var(--font-sans)', fontSize:'15px', color:'var(--text-secondary)'}}>{event.venue}</span>
            </div>
          )}
          {event.time && (
            <div style={{display:'flex', alignItems:'center', gap:12}}>
              <div style={{width:36, height:36, borderRadius:'var(--radius-md)', background:'var(--bg-surface-raised)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
                <IconClock />
              </div>
              <span style={{fontFamily:'var(--font-sans)', fontSize:'15px', color:'var(--text-secondary)'}}>{event.time} hrs</span>
            </div>
          )}
        </div>

        {/* Price + CTA */}
        <div style={{
          marginTop:'auto', display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'20px 20px', borderRadius:'var(--radius-xl)', background:'var(--bg-surface)',
        }}>
          <div>
            <div style={{fontFamily:'var(--font-sans)', fontSize:'10px', fontWeight:'var(--weight-bold)', color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'var(--tracking-widest)', marginBottom:8}}>
              Entrada
            </div>
            <PriceTag price={event.price} variant={event.priceVariant || 'default'} />
          </div>
          <Button variant={event.priceVariant === 'free' ? 'secondary' : 'primary'} size="lg">
            {event.priceVariant === 'free' ? 'Más info' : 'Comprar'}
          </Button>
        </div>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = React.useState('home');
  const [selected, setSelected] = React.useState(null);
  const [activeCategory, setActiveCategory] = React.useState('Todos');
  const [query, setQuery] = React.useState('');

  const filteredEvents = EVENTS.filter(ev => {
    const matchCat = activeCategory === 'Todos' || ev.category.toUpperCase().includes(activeCategory.toUpperCase());
    const matchQ = !query || ev.title.toLowerCase().includes(query.toLowerCase()) || (ev.venue || '').toLowerCase().includes(query.toLowerCase());
    return matchCat && matchQ;
  });

  const openDetail = (ev) => { setSelected(ev); setScreen('detail'); };
  const goBack = () => setScreen('home');

  return (
    <div style={{
      width: 390,
      minHeight: '100vh',
      background: 'radial-gradient(ellipse at 50% 15%, #221d42 0%, #17152f 35%, #0d0e1e 70%, #03021b 100%)',
      overflowY: 'auto',
      overflowX: 'hidden',
    }}>
      {screen === 'home'
        ? <HomeScreen
            events={filteredEvents}
            activeCategory={activeCategory}
            onCategoryChange={setActiveCategory}
            query={query}
            onQueryChange={e => setQuery(e.target.value)}
            onEventClick={openDetail}
          />
        : <DetailScreen event={selected} onBack={goBack} />
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
